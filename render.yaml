# Render deployment for this repo (IMMO-Burundi-Server).
#
# Deploy with: Render → New → Blueprint → point at this repo's root.
# Every value marked `sync: false` is prompted for at deploy time so that no
# secret is ever committed.
#
# This repo is self-contained: the API lives at the repo root and
# @immo/shared-types is vendored under packages/ as a workspace package.
#
# ── MongoDB ──────────────────────────────────────────────────────────────
# Render has no managed MongoDB, so MONGODB_URI must point at an external
# cluster. The IMMO BURUNDI production cluster is MongoDB Atlas M0 at
# cluster0.mw7avba.mongodb.net.
#
# IMPORTANT — the URI MUST end in a database name:
#     mongodb+srv://USER:PASSWORD@cluster0.mw7avba.mongodb.net/immo-burundi
# A `mongodb+srv://` URI with no path silently resolves to the database
# literally named "test", so the app would boot and serve an empty database
# with no error anywhere.
#
# Atlas also gates access by IP. In Network Access either allow Render's
# outbound addresses or add 0.0.0.0/0 while you get the first deploy through.
#
# `sync: false` keeps the password out of this file — Render prompts for it.
# Already seeded into the `immo-burundi` database on that cluster: 21 roles,
# 77 permissions, 276 role grants, 15 provinces / 57 communes / 57 zones,
# 3 users (1 MAIN_ADMIN + 2 demo agents), 28 published properties, 2 visit
# sessions, 2 exchange rates.
#
# ── Persistent disk (uploads) ────────────────────────────────────────────
# No longer needed. Images live in Cloudinary (STORAGE_DRIVER=CLOUDINARY
# below), so nothing under STORAGE_LOCAL_DIR survives a deploy and a paid disk
# is pure cost. Keep this note if a future driver needs local space again.

services:
  - type: web
    name: immo-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    # This repo IS the API (source at the root), so no rootDir narrowing.
    rootDir: .
    # pnpm comes from npm, not `corepack enable`: the corepack bundled with
    # Node 20.18.1 has the pre-rotation npm signing keys, so verifying pnpm's
    # release signature fails with "Cannot find matching keyid". Pinning the
    # exact version here also matches the `packageManager` field in
    # package.json, which pnpm enforces by default.
    buildCommand: >-
      npm install --global pnpm@12.5.1 &&
      pnpm install --frozen-lockfile &&
      pnpm run build
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      # ── Runtime ────────────────────────────────────────────────────────
      - key: NODE_VERSION
        value: "20.18.1"
      - key: NODE_ENV
        value: production
      # PORT is injected by Render; env.ts coerces it. Do not hardcode 4000.
      - key: IPV6
        value: "off"

      # ── Keep-warm (Render free plan) ───────────────────────────────────────
      # The plan suspends the service after ~15 min of no traffic, so the next
      # visitor pays a ~1 min boot. The API then pings its own /api/health on a
      # timer (see src/config/keepWarm.ts).
      #
      # This URL MUST be the public origin below. Render resets the idle timer
      # only for requests that reach its router, so pinging localhost would
      # never keep the instance awake -- a loopback value is refused at boot.
      #
      # Cost: free plans meter 750 instance-hours/month, and an always-on
      # instance bills the full month (~744h).
      - key: KEEP_WARM_ENABLED
        value: "true"
      - key: KEEP_WARM_URL
        value: "https://immo-burundi-server.onrender.com/api/health"
      - key: KEEP_WARM_INTERVAL_MS
        value: "20000"

      # ── Database ───────────────────────────────────────────────────────
      - key: MONGODB_URI
        sync: false

      # ── Auth secrets — rotate before the first real deploy ─────────────
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: "15m"
      - key: JWT_REFRESH_TTL
        value: "30d"

      # ── CORS ───────────────────────────────────────────────────────────
      # Comma-separated list of allowed web origins. Set this to your Netlify
      # URL. It is only consulted for requests that are NOT same-origin, so it
      # matters if you drop the netlify.toml /api proxy and call Render
      # directly via VITE_API_BASE_URL.
      - key: WEB_ORIGIN
        sync: false

      # ── Optional integrations ──────────────────────────────────────────
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FROM_NAME
        value: IMMO BURUNDI
      - key: SETUP_ACCOUNT_TTL_HOURS
        value: "72"

      # ── Storage ────────────────────────────────────────────────────────
      # Cloudinary holds every uploaded image. Render's filesystem is
      # EPHEMERAL, so the previous LOCAL driver lost profile photos and
      # property media on each deploy while the database kept pointing at
      # /uploads/<file>. `pnpm media:to-cloudinary` moved the existing assets
      # across; nothing is written to disk any more.
      - key: STORAGE_DRIVER
        value: CLOUDINARY
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Folder that receives uploads. Assets land in <folder>/uploads/<uuid>.
      - key: CLOUDINARY_FOLDER
        value: immo

      # ── Redis / queue (declared, not yet wired) ────────────────────────
      - key: BULLMQ_ENABLED
        value: "false"
      - key: REDIS_URL
        sync: false

      # ── First admin ────────────────────────────────────────────────────
      # Read by `pnpm db:seed`, which refuses to run when NODE_ENV=production.
      # Seed from a machine pointed at MONGODB_URI rather than from a
      # preDeployCommand — the seed script DROPS the database.
      - key: SEED_MAIN_ADMIN_PHONE
        sync: false
      - key: SEED_MAIN_ADMIN_EMAIL
        sync: false
      - key: SEED_MAIN_ADMIN_PASSWORD
        sync: false
